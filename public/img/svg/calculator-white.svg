<?xml version="1.0" encoding="UTF-8"?>
<svg width="208" height="22" viewBox="0 0 208 22" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>adxcal.com</title>
  <defs>
    <clipPath id="icon-clip">
      <rect x="0" y="0" width="22" height="22" rx="4.5" ry="4.5" />
    </clipPath>
    <style>
      .cls-brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: -0.5px; }
      .cls-tld { fill: #ccff99; }
    </style>
  </defs>
  <!-- App Icon -->
  <g clip-path="url(#icon-clip)">
    <image href="data:image/png;base64," x="0" y="0" width="22" height="22" preserveAspectRatio="xMidYMid slice" />
  </g>
  <!-- App Logo Text -->
  <text x="28" y="17" class="cls-brand">adxcal<tspan class="cls-tld">.com</tspan></text>
</svg>
