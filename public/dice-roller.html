<script>
function genMathRand(){
 if(window.crypto&&window.crypto.getRandomValues){var a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0]/4294967296;}
 return Math.random();}
function dieImg(n){return '<img src="/img/dice/dice'+n+'.svg" width="110" height="110" alt="dice '+n+'">';}
function preShow(){
 var n=parseInt(document.calform.lennumber.value)||1, out='';
 for(var i=0;i<n;i++){var t=Math.floor(genMathRand()*6)+1;
  out+='<span id="rdice'+i+'" style="display:inline-block;width:110px;height:110px;">'+dieImg(t)+'</span>';}
 document.getElementById("resultid").innerHTML=out+'<div id="summulti" style="padding:10px 10px 0 10px;"></div>';}
preShow();
function doInput(v){
 var f=document.calform; v=parseInt(v);
 if(isNaN(v)||v<1){v=1;} else if(v>100){v=100;}
 f.lenrange.value=v; f.lennumber.value=v; preShow();}
function doSliding(v){document.calform.lennumber.value=v; preShow();}
var dCounter=0, rolling=false;
function delayAndShow(){
 var n=parseInt(document.calform.lennumber.value)||1;
 var last=(dCounter++)>=30, sum=0, prod=1;
 for(var i=0;i<n;i++){var t=Math.floor(genMathRand()*6)+1;
  var el=document.getElementById("rdice"+i); if(el) el.innerHTML=dieImg(t);
  sum+=t; prod*=t;}
 if(!last){setTimeout(delayAndShow,50);}
 else{rolling=false;
  document.getElementById("summulti").innerHTML=n>1?'Sum: '+sum+'<br>Product: '+prod:'';}}
function rollDice(){
 if(rolling) return false;
 rolling=true; dCounter=0;
 document.getElementById("summulti").innerHTML='';
 setTimeout(delayAndShow,50); return false;}

var showStop=0;
function inValidation(){
 var f=document.calform2, n=parseInt(f.dicenum.value), s=parseInt(f.diceside.value);
 if(isNaN(s)||s<2) f.diceside.value=2;
 if(isNaN(n)||n<1) f.dicenum.value=1;
 if(n>10000) f.dicenum.value=10000;}
function delayAndShow2(){
 var n=parseInt(document.calform2.dicenum.value)||1, s=parseInt(document.calform2.diceside.value)||2;
 var nums=[], sum=0, prod=1;
 for(var i=0;i<n;i++){var t=Math.floor(genMathRand()*s)+1; nums.push(t); sum+=t; prod*=t;}
 if(showStop==1){
  document.getElementById("resultid2").innerHTML=nums.join(", ");
  setTimeout(delayAndShow2,50);
 }else{
  document.getElementById("resultid2").innerHTML=nums.join(", ")+'<div style="padding-top:10px;">Sum: '+sum+'<br>Product: '+prod+'</div>';}}
function rollDice2(){
 inValidation();
 if(showStop==0){
  showStop=1;
  document.calform2.submit2.value="    Stop    ";
  document.calform2.submit2.style.backgroundColor="#cc3333";
  setTimeout(delayAndShow2,50);
 }else{
  showStop=0;
  document.calform2.submit2.value="    Start    ";
  document.calform2.submit2.style.backgroundColor="#417516";}
 return false;}
function setDice(sides,num){
 document.calform2.diceside.value=sides; document.calform2.dicenum.value=num;
 if(showStop==1) rollDice2();
 rollDice2(); setTimeout(function(){ if(showStop==1) rollDice2(); },800);}
</script>
