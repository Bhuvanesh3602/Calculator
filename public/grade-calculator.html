<script>
var rowCount = 8;
function showHideGrade(){
 var f=document.getElementById('format1').checked, els=document.gradeform.elements;
 for(var i=0;i<els.length;i++){var c=els[i].name.charAt(0);
  if(c==='l'&&els[i].tagName==='SELECT'&&els[i].name!=='lgoal') els[i].style.display=f?'block':'none';
  if(c==='s'&&els[i].type==='text'&&els[i].name!=='sgoal') els[i].style.display=f?'none':'block';}
 return false;}
function showHideWeight(){
 var p=document.getElementById('weight1').checked, els=document.gradeform.elements;
 for(var i=0;i<els.length;i++){ if(els[i].name.charAt(0)==='w'){els[i].classList.remove('inpct'); if(p) els[i].classList.add('inpct');} }
 return false;}
function showHidePlanning(){
 document.getElementById('gradeplanning').style.display=document.getElementById('plan').checked?'block':'none';
 return false;}
function addRows(){
 var L='<option value="">-</option><option value="a+">A+</option><option value="a">A</option><option value="a-">A-</option><option value="b+">B+</option><option value="b">B</option><option value="b-">B-</option><option value="c+">C+</option><option value="c">C</option><option value="c-">C-</option><option value="d+">D+</option><option value="d">D</option><option value="d-">D-</option><option value="f">F</option>', h='';
 for(var i=0;i<3;i++){rowCount++;
  h+='<div class="grade-row"><input type="text" name="d'+rowCount+'" class="inlonger" aria-label="Assignment '+rowCount+' name"><span class="g"><input type="text" name="s'+rowCount+'" class="in4char" aria-label="Grade '+rowCount+'"><select name="l'+rowCount+'" style="display:none" aria-label="Letter grade '+rowCount+'">'+L+'</select></span><input type="text" name="w'+rowCount+'" class="innormal inpct" aria-label="Weight '+rowCount+'" onchange="updateRemaining();"></div>';}
 document.getElementById('morerows').insertAdjacentHTML('beforeend',h);
 showHideGrade(); showHideWeight(); return false;}
function updateRemaining(){
 var els=document.gradeform.elements, total=0;
 if(!document.getElementById('weight1').checked) return false;
 for(var i=0;i<els.length;i++){
  if(els[i].name.charAt(0)==='w'&&els[i].name!=='wremain'){var v=parseFloat((''+els[i].value).trim()); if(!isNaN(v)) total+=v;} }
 document.gradeform.wremain.value=Math.max(0,100-total); return false;}
showHideGrade(); showHideWeight(); showHidePlanning();
</script>
